name: Backend checks
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cinema_test
          POSTGRES_USER: cinema
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cinema -d cinema_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DB_URL: jdbc:postgresql://localhost:5432/cinema_test
      DB_USERNAME: cinema
      DB_PASSWORD: ci-test-only
      DEMO_PASSWORD: ci-demo-only-password
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test scripts/swagger-request.test.mjs
      - run: chmod +x mvnw && ./mvnw -B -Pdatabase-tests verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco

      - name: SonarQube Cloud analysis and quality gate
        if: >-
          vars.SONAR_ENABLED == 'true' &&
          ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
          (github.event_name == 'pull_request' && github.base_ref == 'main' &&
          github.event.pull_request.head.repo.full_name == github.repository))
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          : "${SONAR_TOKEN:?Set the SONAR_TOKEN repository secret before enabling Sonar}"
          : "${SONAR_ORGANIZATION:?Set the SONAR_ORGANIZATION repository variable}"
          : "${SONAR_PROJECT_KEY:?Set the SONAR_PROJECT_KEY repository variable}"
          test -s target/site/jacoco/jacoco.xml
          ./mvnw -B sonar:sonar \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300
