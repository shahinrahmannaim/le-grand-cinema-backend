name: Backend checks
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: cinema_test
          POSTGRES_USER: cinema
          POSTGRES_PASSWORD: ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U cinema -d cinema_test"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DB_URL: jdbc:postgresql://localhost:5432/cinema_test
      DB_USERNAME: cinema
      DB_PASSWORD: ci-test-only
      DEMO_PASSWORD: ci-demo-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B -Pdatabase-tests verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports
            target/site/jacoco
