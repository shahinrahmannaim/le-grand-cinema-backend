spring:
  application:
    name: le-grand-cinema
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/legrandcinema}
    username: ${DB_USERNAME:cinema}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 0
      connection-timeout: 10000
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
cinema:
  swagger-ui-version: 5.35.0
  secure-cookies: ${SECURE_COOKIES:false}
  allowed-origins: ${ALLOWED_ORIGINS:http://localhost:4200}
