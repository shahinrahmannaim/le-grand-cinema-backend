openapi: 3.0.3
info:
  title: Le Grand Cinéma API
  version: 1.0.0
  description: Projet pédagogique. Sessions JDBC ; CSRF sur toutes les écritures,
    y compris connexion et inscription. Cookie HttpOnly Secure en production. Deux
    dépôts, proxy de même origine. Prix en centimes EUR. Les listes administration
    / statistiques conservent les noms de colonnes snake_case ; les DTO client utilisent
    camelCase.
servers:
- url: /api
paths:
  /catalog/films:
    get:
      summary: Films publiés ayant une séance future
      description: Films publiés ayant une séance future
      tags:
      - public
      responses:
        '200':
          description: Succès
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Film'
        '400':
          description: Entrée invalide
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Session absente / identifiants incorrects
        '403':
          description: Droits insuffisants / CSRF invalide
        '404':
          description: Ressource absente ou billet non autorisé
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Conflit de places, d’idempotence, d’e-mail, de programmation
            ou historique protégé
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Limitation des tentatives
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security: []
