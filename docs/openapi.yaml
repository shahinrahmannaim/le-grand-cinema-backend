components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: CINEMA_SESSION
  schemas:
    Problem:
      type: object
      properties:
        status:
          type: integer
        detail:
          type: string
        title:
          type: string
    Account:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum:
          - CLIENT
          - STAFF
          - ADMIN
    Register:
      type: object
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 12
          maxLength: 72
          description: 72 octets UTF-8 maximum
        displayName:
          type: string
          minLength: 1
          maxLength: 100
      required:
      - email
      - password
      - displayName
    Login:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
      - email
      - password
    Csrf:
      type: object
      properties:
        token:
          type: string
        headerName:
          type: string
    Film:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        synopsis:
          type: string
        durationMinutes:
          type: integer
        genre:
          type: string
        posterUrl:
          type: string
          nullable: true
    Screening:
      type: object
      properties:
        id:
          type: string
          format: uuid
        filmId:
          type: string
          format: uuid
        roomName:
          type: string
        startsAt:
          type: string
          format: date-time
        priceCents:
          type: integer
    Seat:
      type: object
      properties:
        id:
          type: string
          format: uuid
        rowNumber:
          type: integer
        seatNumber:
          type: integer
        occupied:
          type: boolean
    Plan:
      type: object
      properties:
        screeningId:
          type: string
          format: uuid
        title:
          type: string
        roomName:
          type: string
        startsAt:
          type: string
          format: date-time
        priceCents:
          type: integer
        seats:
          type: array
          items:
            $ref: '#/components/schemas/Seat'
    Booking:
      type: object
      properties:
        screeningId:
          type: string
          format: uuid
        seatIds:
          type: array
          minItems: 1
          maxItems: 10
          uniqueItems: true
          items:
            type: string
            format: uuid
        idempotencyKey:
          type: string
          format: uuid
      required:
      - screeningId
      - seatIds
      - idempotencyKey
    Ticket:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        title:
          type: string
        roomName:
          type: string
        startsAt:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - CONFIRMED
          - CANCELLED
        channel:
          type: string
          enum:
          - WEB
          - BOX_OFFICE
        totalCents:
          type: integer
        seats:
          type: array
          items:
            type: string
    FilmInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        synopsis:
          type: string
          minLength: 1
          maxLength: 10000
        durationMinutes:
          type: integer
          minimum: 1
          maximum: 600
        genre:
          type: string
          minLength: 1
          maxLength: 60
        posterUrl:
          type: string
          maxLength: 500
          description: URL HTTPS ou chaîne vide
        published:
          type: boolean
      required:
      - title
      - synopsis
      - durationMinutes
      - genre
      - published
    ShowInput:
      type: object
      properties:
        filmId:
          type: string
          format: uuid
        roomId:
          type: string
          format: uuid
        startsAt:
          type: string
          format: date-time
        priceCents:
          type: integer
          minimum: 0
          maximum: 100000
      required:
      - filmId
      - roomId
      - startsAt
      - priceCents
    Id:
      type: object
      properties:
        id:
          type: string
          format: uuid
    Publication:
      type: object
      properties:
        published:
          type: boolean
      required:
      - published
    AdminFilm:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        synopsis:
          type: string
        duration_minutes:
          type: integer
        genre:
          type: string
        poster_url:
          type: string
          nullable: true
        published:
          type: boolean
    Room:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        category:
          type: string
        capacity:
          type: integer
        turnaround_minutes:
          type: integer
    AdminScreening:
      type: object
      properties:
        id:
          type: string
          format: uuid
        film_id:
          type: string
          format: uuid
        room_id:
          type: string
          format: uuid
        title:
          type: string
        room_name:
          type: string
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        occupied_until:
          type: string
          format: date-time
        price_cents:
          type: integer
        cancelled:
          type: boolean
    ReservationRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        reference:
          type: string
        status:
          type: string
        channel:
          type: string
        total_cents:
          type: integer
        created_at:
          type: string
          format: date-time
        starts_at:
          type: string
          format: date-time
        title:
          type: string
        room_name:
          type: string
        seats:
          type: integer
    Search:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReservationRow'
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    Occupancy:
      type: object
      properties:
        id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        title:
          type: string
        room_name:
          type: string
        capacity:
          type: integer
        booked_seats:
          type: integer
        occupancy_percent:
          type: number
    Bucket:
      type: object
      properties:
        day:
          type: string
          format: date
        hour:
          type: integer
        weekend:
          type: boolean
        screenings:
          type: integer
        booked_seats:
          type: integer
    Analytics:
      type: object
      properties:
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        current:
          type: array
          items:
            $ref: '#/components/schemas/Bucket'
        baseline:
          type: array
          items:
            $ref: '#/components/schemas/Bucket'
        limitation:
          type: string
